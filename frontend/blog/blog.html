<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Technical field note - Cybersecurity Portfolio"
    />
    <title>Blogs | SECProfile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../src/styles.css" />
  </head>
  <body>
    <header class="navbar-header">
      <div class="nav-container">
        <a href="https://hminhtri.cloud/" class="nav-logo"
          ><span class="logo-badge"
            ><i class="fa-solid fa-shield-halved"></i></span
          ><span class="logo-text"
            >SEC<span class="highlight">PROFILE</span></span
          ></a
        ><button
          class="mobile-toggle"
          id="mobile-toggle"
          aria-label="Toggle navigation"
        >
          <i class="fa-solid fa-bars"></i>
        </button>
        <nav class="nav-links" id="nav-links">
          <a href="https://hminhtri.cloud/" class="nav-link">Home</a
          ><a href="https://projects.hminhtri.cloud/" class="nav-link"
            >Projects</a
          ><a href="https://experience.hminhtri.cloud/" class="nav-link"
            >Experience</a
          ><a href="https://blog.hminhtri.cloud/" class="nav-link">Blog</a
          ><a href="https://hminhtri.cloud/#contact" class="nav-link"
            >Contact</a
          >
        </nav>
      </div>
    </header>
    <main class="standalone-page">
      <div class="container">
        <a href="https://hminhtri.cloud/" class="page-back"
          ><i class="fa-solid fa-arrow-left"></i> Back to portfolio</a
        >
        <section class="section blogs-section" id="blogs">
          <div class="section-header text-center">
            <span class="sub-heading">TECHNICAL FIELD NOTES</span>
            <h1 class="section-title">Technology &amp; Cybersecurity Blog</h1>
            <div class="heading-line"></div>
            <p class="section-intro">
              Hands-on field notes about Blue Team, SOC, DFIR, and security
              automation.
            </p>
          </div>
          <div class="blogs-grid" id="blog-container" aria-live="polite">
            <div class="blog-state">
              <i class="fa-solid fa-spinner fa-spin"></i> Loading posts...
            </div>
          </div>
          <div class="blog-footer-link">
            <a
              class="btn btn-outline btn-pill"
              href="https://blog.hminhtri.cloud/auth.html"
              ><i class="fa-solid fa-right-to-bracket"></i> Account Login</a
            >
          </div>
        </section>
      </div>
    </main>
    <button
      class="theme-toggle"
      id="theme-toggle"
      aria-label="Toggle theme"
      title="Toggle light / dark theme"
    >
      <div class="island-content">
        <i class="fa-solid fa-moon theme-icon"></i
        ><span class="theme-text">Dark Mode</span>
      </div>
    </button>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="src/script.js"></script>
    <script src="blog.js"></script>
  </body>
</html>
