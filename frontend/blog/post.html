<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Technical field note - Cybersecurity Portfolio"
    />
    <title>Blog Article | SECProfile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../src/styles.css" />
  </head>
  <body>
    <header class="navbar-header">
      <div class="nav-container">
        <a href="https://hminhtri.cloud/" class="nav-logo"
          ><span class="logo-badge"
            ><i class="fa-solid fa-shield-halved"></i></span
          ><span class="logo-text"
            >SEC<span class="highlight">PROFILE</span></span
          ></a
        >
        <nav class="nav-links">
          <a href="https://hminhtri.cloud/">Home</a
          ><a href="https://projects.hminhtri.cloud/">Projects</a
          ><a href="https://experience.hminhtri.cloud/">Experience</a
          ><a href="https://blog.hminhtri.cloud/">Blog</a
          ><a href="https://hminhtri.cloud/#contact">Contact</a>
        </nav>
      </div>
    </header>
    <main class="standalone-page">
      <div class="container article-shell">
        <a href="https://blog.hminhtri.cloud/" class="page-back"
          ><i class="fa-solid fa-arrow-left"></i> Back to Blogs</a
        >
        <article id="article-container">
          <div class="blog-state">
            <i class="fa-solid fa-spinner fa-spin"></i> Loading article...
          </div>
        </article>
      </div>
    </main>
    <button
      class="theme-toggle"
      id="theme-toggle"
      aria-label="Toggle theme"
      title="Toggle light / dark theme"
    >
      <div class="island-content">
        <i class="fa-solid fa-moon theme-icon"></i
        ><span class="theme-text">Dark Mode</span>
      </div>
    </button>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="blog.js"></script>
  </body>
</html>
