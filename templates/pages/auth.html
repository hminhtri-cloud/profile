{% extends "base.html" %}
{% set title = "Account | SECProfile" %}
{% block content %}
<main class="standalone-page">
      <div class="container auth-shell">
        <a href="{{ url_for('home') }}" class="page-back"
          ><i class="fa-solid fa-arrow-left"></i> Back to portfolio</a
        >
        <section class="auth-card">
          <span class="sub-heading">SECURE ACCESS</span>
          <h1>SECProfile Account</h1>
          <p>Register or log in to continue.</p>
          <div class="auth-tabs">
            <button class="auth-tab active" data-mode="login">Log In</button
            ><button class="auth-tab" data-mode="register">Register</button>
          </div>
          <form id="auth-form">
            <div class="form-group hidden" id="username-field">
              <label for="username">Username</label
              ><input id="username" name="username" autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="email">Email</label
              ><input
                id="email"
                name="email"
                type="email"
                required
                autocomplete="email"
              />
            </div>
            <div class="form-group">
              <label for="password">Password</label
              ><input
                id="password"
                name="password"
                type="password"
                minlength="8"
                required
                autocomplete="current-password"
              />
            </div>
            <button
              class="btn btn-primary btn-lg btn-block btn-pill"
              type="submit"
            >
              <span id="submit-label">Log In</span
              ><i class="fa-solid fa-arrow-right"></i>
            </button>
            <div class="auth-alert hidden" id="auth-alert"></div>
          </form>
        </section>
      </div>
    </main>
{% endblock %}
{% block footer %}{% endblock %}
{% block theme_toggle %}{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/auth.js') }}"></script>{% endblock %}
